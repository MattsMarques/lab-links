<!DOCTYPE html>
<html>
  <head>
    <title>Lab Links</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl shadow-xl w-full max-w-md overflow-hidden border border-gray-100">
        <div class="bg-indigo-900 px-6 py-8 text-center text-white">
          <h1 class="text-2xl font-bold tracking-tight">Links de Acesso</h1>
          <p class="text-gray-400 text-sm mt-2">Selecione a área que deseja acessar</p>
        </div>
        <nav class="p-6 space-y-4">
          <a class="w-full group flex items-center p-4 bg-white border border-gray-200 rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 text-left cursor-pointer transform hover:-translate-y-1 hover:border-pink-500 hover:ring-1 hover:ring-pink-500" href="pages/quizzes.html">
            <div>
              <h2 class="text-base font-semibold text-gray-800 group-hover:text-gray-900">Quizzes</h2>
              <p class="text-xs text-gray-500 mt-1">Acesse os quizzes</p>
            </div>
          </a>
          <a class="w-full group flex items-center p-4 bg-white border border-gray-200 rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 text-left cursor-pointer transform hover:-translate-y-1 hover:border-pink-500 hover:ring-1 hover:ring-pink-500" href="pages/jogos-plugados.html">
            <div>
              <h2 class="text-base font-semibold text-gray-800 group-hover:text-gray-900">Jogos Plugados</h2>
              <p class="text-xs text-gray-500 mt-1">Jogos para ensino de computação</p>
            </div>
          </a>
        </nav>
      </div>
  </body>
</html>
